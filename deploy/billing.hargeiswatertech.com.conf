# Billing clerk portal - employee traffic ONLY
# https://billing.hargeiswatertech.com -> Yii backend app
<VirtualHost *:80>
    ServerName billing.hargeiswatertech.com
    DocumentRoot /home/admin/nobleus-admin/backend/web

    <Directory /home/admin/nobleus-admin/backend/web>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Block access to hidden files (.env, .htaccess sources, etc.)
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # Security headers
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog ${APACHE_LOG_DIR}/billing-error.log
    CustomLog ${APACHE_LOG_DIR}/billing-access.log combined
</VirtualHost>
