# Machine-to-machine API - telemetry traffic ONLY
# https://api.hargeisawatertech.com/v1/telemetry-receive -> Yii api app
<VirtualHost *:80>
    ServerName api.hargeisawatertech.com
    DocumentRoot /home/admin/nobleus-admin/api/web

    <Directory /home/admin/nobleus-admin/api/web>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # No browser CORS needed for machine-to-machine telemetry;
    # keep CORS only if the mobile app also uses this domain.
    Header always set X-Content-Type-Options "nosniff"

    ErrorLog ${APACHE_LOG_DIR}/api-error.log
    CustomLog ${APACHE_LOG_DIR}/api-access.log combined
</VirtualHost>
